name: Update Orton Rangers U11 Calendar

on:
  workflow_dispatch:
  schedule:
    # Once a week, Friday evening (UTC) -- catches most fixture changes
    # announced ahead of Saturday matches while keeping requests to the
    # fixtures proxy to a minimum. Use "Run workflow" above any time you
    # want an up-to-date check outside this schedule (e.g. Saturday
    # morning before you leave for a match).
    - cron: "0 18 * * 5"

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Generate calendar
        run: |
          python generate_calendar.py

      - name: Create Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

  deploy:
    needs: generate
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy calendar to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
